# Clipper settings. Most of these are editable from Settings (tray icon > Settings...).
secs=30
fps=60
bitrate=15M
# height: 0 = native resolution, or 720 / 1080 / 1440 (scaled on the CPU)
height=0
# encoder: auto (tries NVIDIA, AMD, Intel, then CPU) or h264_nvenc / h264_amf / h264_qsv / libx264
encoder=auto
# capture: ddagrab (GPU, default) or gdigrab (works on any PC, uses more CPU)
capture=ddagrab
monitor=0
out=
desktop_audio=on
# mic: default | off | part of a device name, e.g. "Blue Yeti"
mic=default
# set to on only if the default GPU capture path fails
cpu_copy=off
key_save=Alt+F10
key_gallery=Alt+F11
key_quit=Alt+F12
# Name overrides for detected games: alias.<exe name without .exe>=Display Name
# alias.javaw=Minecraft
